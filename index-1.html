<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef8f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#eef8f1;--card:#fff;--tx:#34443a;--mu:#7a8c80;--bd:#dcebe0;--ac:#f2a7c3;--onac:#4a2336;--act:#c2487a;--ok:#86d0a1;--okt:#2b7a4b;--wa:#f2c066;--wat:#94590a;--er:#e8728e;--ert:#b3233f;--okb:#e2f6e8;--wab:#fff3d9;--erb:#fde4ea;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2026;--tx:#eef0f3;--mu:#9aa3ad;--bd:#2c333b;--ac:#2dd4bf;--ok:#4ade80;--wa:#fbbf24;--er:#f87171;--okb:#12301e;--wab:#3a2d0b;--erb:#3b1515;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2026;--tx:#eef0f3;--mu:#9aa3ad;--bd:#2c333b;--ac:#2dd4bf;--ok:#4ade80;--wa:#fbbf24;--er:#f87171;--okb:#12301e;--wab:#3a2d0b;--erb:#3b1515;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Quicksand,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
input,select,button{font-family:inherit}
h1,h2,.big{font-family:Fredoka,Quicksand,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 92px}
h1{font-size:20px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.lbl{font-size:13px;color:var(--mu)}
.big{font-size:30px;font-weight:700;margin:2px 0}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--mu)}
.barwrap{position:relative;margin:46px 0 6px}
.cat{position:absolute;bottom:10px;left:0;transform:translateX(-50%);transition:left 1.2s ease-in-out;pointer-events:none;line-height:0}
.cat svg{overflow:visible;display:block}
@keyframes sw{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.9px)}}
.walk .la{animation:sw .42s ease-in-out infinite alternate}
.walk .lb{animation:sw .42s ease-in-out infinite alternate-reverse}
.walk .cb{animation:bob .42s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.walk .la,.walk .lb,.walk .cb{animation:none}}
.bar{height:12px;border-radius:99px;background:var(--bd);overflow:hidden;margin:0}
.fill{height:100%;width:0;background:var(--ok);transition:width .3s,background .3s}
.alert{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600}
.alert.ok{display:block;background:var(--okb);color:var(--okt)}
.alert.wa{display:block;background:var(--wab);color:var(--wat)}
.alert.er{display:block;background:var(--erb);color:var(--ert)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
button{font:inherit;cursor:pointer}
.btn{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:var(--ac);color:var(--onac);font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#06201c}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
details summary{cursor:pointer;font-weight:600}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}
.item:first-child{border-top:0}
.item b{display:block}
.item small{color:var(--mu)}
.x{border:0;background:none;color:var(--er);font-size:18px;padding:4px 8px}
.link{background:none;border:0;color:var(--mu);text-decoration:underline;font-size:13px;margin-top:8px}
.empty{color:var(--mu);text-align:center;padding:12px 0}
.srow{display:grid;grid-template-columns:auto 1fr 112px;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.srow input[type=checkbox]{width:20px;height:20px}
.srow select{grid-column:2/4}
.stot{font-size:14px;margin-top:10px;display:flex;justify-content:space-between;gap:8px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:8px 0 10px;font-size:12px}
nav button span{display:block;font-size:22px;line-height:1.15}
nav button.on{color:var(--act);font-weight:700}
.krow{padding:10px 0;border-top:1px solid var(--bd)}
.krow:first-child{border-top:0}
.kh{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.kd{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
.kb{height:8px;border-radius:99px;background:var(--bd);overflow:hidden;margin:6px 0 4px}
.kb i{display:block;height:100%;border-radius:99px}
#lock{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:var(--bg);display:none;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
html.locked #lock{display:flex}
.lkbox{width:100%;max-width:300px;text-align:center}
.lkbox h2{margin:6px 0 4px;font-size:20px}
.lkem{font-size:40px;line-height:1}
.lkS{min-height:20px;font-size:13px;color:var(--mu)}
.lkS.err{color:var(--ert);font-weight:600}
.dots{display:flex;justify-content:center;gap:14px;margin:16px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--act);background:transparent}
.dots i.on{background:var(--act)}
.dots.shake{animation:shk .35s}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:58px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:22px;font-weight:600}
.pad button:active{background:var(--ac)}
.pie-card{position:relative;margin-top:38px;text-align:center}
.peek{position:absolute;left:50%;top:-31px;transform:translateX(-50%);line-height:0;pointer-events:none}
.pie{width:100%;max-width:260px;height:auto;display:block;margin:10px auto 0;overflow:visible;animation:popin .5s ease-out}
.pie .sl{cursor:pointer;stroke:#fff;stroke-width:2.5;stroke-linejoin:round;transition:transform .2s,opacity .2s;outline:none}
.pie .sl:focus-visible{stroke:var(--act)}
@keyframes popin{from{opacity:0;transform:scale(.85) rotate(-20deg)}to{opacity:1;transform:none}}
.pieInfo,#pieInfo{margin-top:12px;font-weight:600;font-size:15px;padding:9px 12px;border-radius:10px;background:var(--bg)}
.krow.sel{background:var(--bg);border-radius:10px;padding-left:8px;padding-right:8px}
</style>
</head>

<main>
<h1 style="display:flex;align-items:center;gap:8px"><svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true" fill="#f08cb3"><path d="M16 15 C11 15 7 20 7 24 C7 27.5 10 28.5 13 27.5 C14.5 27 15.2 26.8 16 26.8 C16.8 26.8 17.5 27 19 27.5 C22 28.5 25 27.5 25 24 C25 20 21 15 16 15Z"/><ellipse cx="6.5" cy="13.5" rx="3" ry="4" transform="rotate(-18 6.5 13.5)"/><ellipse cx="12.5" cy="7.5" rx="3" ry="4.2" transform="rotate(-6 12.5 7.5)"/><ellipse cx="19.5" cy="7.5" rx="3" ry="4.2" transform="rotate(6 19.5 7.5)"/><ellipse cx="25.5" cy="13.5" rx="3" ry="4" transform="rotate(18 25.5 13.5)"/></svg>Pawllet</h1>

<div class="card">
  <div class="lbl">Sisa uang</div>
  <div class="big" id="saldo">Rp0</div>

<circle cx="48.2" cy="22.6" r="1" fill="#fff"/><circle cx="70.2" cy="22.6" r="1" fill="#fff"/>
<ellipse cx="60" cy="28.5" rx="1.8" ry="1.3" fill="#e8908a"/>
<circle cx="43" cy="29" r="2.4" fill="#f9b9ce" opacity=".7"/><circle cx="77" cy="29" r="2.4" fill="#f9b9ce" opacity=".7"/>

<script>
(function(){
var KEY="catatan-uang-v1";
var S={gaji:6000000,tetap:2000000,mingguan:1000000,items:[]};
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&Array.isArray(o.items))S=o;}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var $=function(i){return document.getElementById(i)};
function rp(n){return "Rp"+Math.round(n).toLocaleString("id-ID")}
function iso(d){var m=d.getMonth()+1,k=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(k<10?"0":"")+k}
function weekRange(){var d=new Date();d.setHours(0,0,0,0);var day=(d.getDay()+6)%7;var s=new Date(d);s.setDate(d.getDate()-day);var e=new Date(s);e.setDate(s.getDate()+6);return[iso(s),iso(e),s,e]}
function fmtD(d){return d.toLocaleDateString("id-ID",{day:"numeric",month:"short"})}

function render(){
  renderKat();
  var total=S.items.reduce(function(a,b){return a+b.nom},0);
  var saldo=S.gaji-S.tetap-total;
  var el=$("saldo");el.textContent=rp(saldo);el.style.color=saldo<0?"var(--er)":"var(--tx)";
  $("info1").textContent="Masuk "+rp(S.gaji)+" − tetap "+rp(S.tetap);
  $("info2").textContent="Keluar "+rp(total);

  var wr=weekRange();
  $("rentang").textContent=fmtD(wr[2])+" – "+fmtD(wr[3]);
  var wk=S.items.filter(function(x){return x.tgl>=wr[0]&&x.tgl<=wr[1]}).reduce(function(a,b){return a+b.nom},0);
  var t=S.mingguan||0;
  var pct=t>0?wk/t*100:0;
  $("pakai").textContent=rp(wk);
  $("targetTxt").textContent="dari "+rp(t);
  $("fill").style.width=Math.min(pct,100)+"%";setCat(pct);
  $("pct").textContent=Math.round(pct)+"% terpakai";
  var sisa=t-wk;
  $("sisaMg").textContent=sisa>=0?"Sisa "+rp(sisa):"Lebih "+rp(-sisa);
  var a=$("alert"),f=$("fill");
  if(t<=0){a.className="alert";}
  else if(pct>=100){a.className="alert er";a.textContent="⚠️ Melebihi target minggu ini sebesar "+rp(-sisa)+". Tahan dulu pengeluaran sampai minggu depan.";f.style.background="var(--er)";}
  else if(pct>=80){a.className="alert wa";a.textContent="⚠️ Hampir melebihi target! Tinggal "+rp(sisa)+" untuk minggu ini.";f.style.background="var(--wa)";}
  else{a.className="alert ok";a.textContent="✓ Aman, pengeluaran minggu ini masih terkendali.";f.style.background="var(--ok)";}

  var L=$("list");L.textContent="";
  if(!S.items.length){var e=document.createElement("div");e.className="empty";e.textContent="Belum ada catatan.";L.appendChild(e);return;}
  S.items.slice().sort(function(x,y){return y.tgl<x.tgl?-1:y.tgl>x.tgl?1:y.id-x.id}).forEach(function(it){
    var r=document.createElement("div");r.className="item";
    var l=document.createElement("div");
    var b=document.createElement("b");b.textContent="−"+rp(it.nom);
    var s=document.createElement("small");
    var dd=new Date(it.tgl+"T00:00:00");
    s.textContent=it.kat+(it.cat?" · "+it.cat:"")+" · "+fmtD(dd);
    l.appendChild(b);l.appendChild(s);
    var x=document.createElement("button");x.className="x";x.textContent="✕";x.setAttribute("aria-label","Hapus");
    x.onclick=function(){S.items=S.items.filter(function(q){return q.id!==it.id});save();render();};
    r.appendChild(l);r.appendChild(x);L.appendChild(r);
  });
}

var KC={"Makan":"#f8a5c2","Transportasi":"#8fd3a8","Pulsa/Internet":"#a9d6f5","Kebutuhan rumah":"#ffd48a","Hiburan/Jajan":"#c9b3f0","Darurat":"#f7a9a0","Lainnya":"#c8d3cc"};
var selK=null,PD={cats:[],map:{},tot:0};
function slicePath(cx,cy,r,a0,a1){
  var x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
  return "M"+cx+" "+cy+" L"+x0.toFixed(2)+" "+y0.toFixed(2)+" A"+r+" "+r+" 0 "+(a1-a0>Math.PI?1:0)+" 1 "+x1.toFixed(2)+" "+y1.toFixed(2)+" Z";
}
function renderPie(cats,map,tot){
  PD={cats:cats,map:map,tot:tot};
  var P=$("pie");P.textContent="";
  if(selK&&!map[selK])selK=null;
  if(!cats.length){
    var e=document.createElement("div");e.className="empty";e.textContent="Belum ada data untuk grafik.";P.appendChild(e);
    $("pieInfo").textContent="";$("pieInfo").style.boxShadow="none";return;
  }
  var NS="http://www.w3.org/2000/svg",svg=document.createElementNS(NS,"svg"),a=-Math.PI/2;
  svg.setAttribute("viewBox","0 0 200 200");svg.setAttribute("class","pie");
  cats.forEach(function(k){
    var v=map[k],ang=v/tot*2*Math.PI,el;
    if(cats.length===1){
      el=document.createElementNS(NS,"circle");
      el.setAttribute("cx",100);el.setAttribute("cy",100);el.setAttribute("r",78);
    }else{
      el=document.createElementNS(NS,"path");
      el.setAttribute("d",slicePath(100,100,78,a,a+ang));
    }
    var mid=a+ang/2;
    el.setAttribute("fill",KC[k]||"#c8d3cc");el.setAttribute("class","sl");
    el.setAttribute("tabindex","0");el.setAttribute("role","button");
    el.setAttribute("aria-label",k+" "+rp(v));
    el.dataset.mx=(cats.length===1?0:Math.cos(mid)*7).toFixed(2);
    el.dataset.my=(cats.length===1?0:Math.sin(mid)*7).toFixed(2);
    el.onclick=function(){pick(k);};
    el.onkeydown=function(ev){if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();pick(k);}};
    svg.appendChild(el);a+=ang;
  });
  P.appendChild(svg);

      P=it.map(function(x){var k=KATS.indexOf(x.kategori)>=0?x.kategori:"Lainnya";return{nama:String(x.nama||"Barang"),nom:Math.round(Number(x.jumlah))||0,kat:k,on:true};});
      if(!P.length)msg("Tidak ada barang yang terbaca. Coba foto yang lebih jelas dan lurus.");
      else msg((toko?toko+" · ":"")+P.length+" barang terbaca. Cek dan ubah dulu kalau ada yang salah.");
      renderScan();
    }catch(e){
